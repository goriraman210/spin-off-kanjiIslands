
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spin-off（スピンオフ）漢字 Typing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon (8).ico" sizes="any">
<style>
    body{
    margin:0;
    background:#000;
    overflow:hidden;

    font-family:"Yomogi", cursive;
}


/* タイトル画面 */

#title-screen{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:#000;
    color:#fff;

    font-family:"Yomogi", cursive;

    opacity:0;
    transition:opacity 0.8s ease;

}


#title-screen.show{
    opacity:1;
}


#title-screen.hide{
    opacity:0;
}



#title-screen h1{

    margin:0;

    font-size:64px;

    line-height:1.3;

}



.gradient-text{

    background:linear-gradient(to bottom,#FFD700,#00C853);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    background-clip:text;

    color:transparent;

    font-size:52px;

}



/* 会社名画面 */

#company-screen{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:#000;

    font-family:"Yomogi", cursive;

    opacity:0;

    transition:opacity .8s ease;

}



#company-screen.show{

    opacity:1;

}



#company-screen.hide{

    opacity:0;

}



.company{

    color:#fff;

    font-size:56px;

    margin-bottom:50px;

}



.member-grid{

    display:grid;

    grid-template-columns:auto auto;

    gap:20px 120px;

    justify-content:center;

}



.member{

    font-size:40px;


    background:linear-gradient(to bottom,#ffffff,#66ccff);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    background-clip:text;

    color:transparent;

}
/* OP省略 */

#skip-screen{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
    color:#fff;

    font-family:"Yomogi", cursive;

    opacity:0;
    transition:opacity .8s ease;

}

#skip-screen.show{
    opacity:1;
}

#skip-screen.hide{
    opacity:0;
}

#skip-screen h1{
    font-size:60px;
}
/* スタート画面 */

#start-screen{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;

    opacity:0;

    transition:opacity .8s ease;

}

#start-screen.show{

    opacity:1;

}

#start-btn{

    width:320px;
    height:90px;

    border:none;
    border-radius:18px;

    background:#666;

    color:#fff;

    font-size:40px;

    font-family:"Yomogi", cursive;

    cursor:pointer;

    transition:all .25s ease;

}

#start-btn:hover{

    background:#888;

    transform:scale(1.05);

}
/* 名前入力画面 */
#name-panel{

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100vh;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.6);

}

#name-panel.show{

    display: flex;

}

#name-panel .panel{

    width: 500px;
    padding: 35px;

    background: #6f6f6f;

    border-radius: 25px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,.5);

}
/* タイトル */
#name-panel h2{
    margin: 0;
    color: white;
    font-size: 38px;
    font-weight: bold;
}

/* 入力欄 */
#player-name{
    width: 90%;
    height: 65px;
    border: none;
    border-radius: 15px;
    background: white;
    font-size: 28px;
    text-align: center;
    outline: none;

    font-family: "Yomogi", cursive;
}

/* 決定ボタン */
#name-ok-btn{
    width: 90%;
    height: 70px;
    border: none;
    border-radius: 15px;
    background: #59d8ff;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;

    font-family: "Yomogi", cursive;
}

#name-ok-btn:hover{
    background: #38cbff;
    transform: scale(1.03);
}

#name-ok-btn:active{
    transform: scale(0.98);
}
/* 性別パネル */

#gender-panel{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.6);

    font-family:"Yomogi", cursive;

}

#gender-panel.show{

    display:flex;

}

#gender-panel .panel{

    width:500px;

    padding:35px;

    background:#6f6f6f;

    border-radius:25px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:30px;

}

#gender-panel h2{

    margin:0;

    color:white;

    font-size:40px;

}

.gender-area{

    width:100%;

    display:flex;

    justify-content:space-around;

}

.gender-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    cursor:pointer;

}

.gender-icon{

    width:90px;
    height:90px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:48px;

    color:white;

}

#male-box .gender-icon{

    background:#4fc3ff;

}

#female-box .gender-icon{

    background:#ff6bb5;

}

.gender-arrow{

    margin-top:15px;

    font-size:42px;

    color:white;

    height:42px;

}

.gender-arrow.show{

    visibility:visible;

}

#gender-ok-btn{

    width:90%;
    height:70px;

    border:none;

    border-radius:15px;

    background:#59d8ff;

    color:white;

    font-size:30px;

    font-family:"Yomogi", cursive;

    cursor:pointer;

}
/* プレイヤー生成画面 */

#create-screen{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    background:#000;

}

#create-screen.show{

    display:flex;

}
#gear{
    position:fixed;
    left:50%;
    top: 35%;
    transform:translate(-50%,-50%);

    transition:
        left 1.2s ease,
        top 1.2s ease;
        z-index:1000;
}
#gear.move{
    animation: gearMove 1.2s ease forwards;
}

@keyframes gearMove{

    0%{
        
        transform:translate(-50%,-50%) rotate(0deg);
        font-size:39px;
    }

    40%{
        transform:translate(-50%,-50%) rotate(360deg);
        font-size:58px;
    }

    75%{
        transform:translate(-50%,-50%) rotate(630deg);
        font-size:48px;
    }

    100%{
        transform:translate(-50%,-50%) rotate(720deg);
        font-size:27px;
    }

}
#player-ball{

    width:80px;
    height:80px;

    border-radius:50%;

    margin-top:-30px;

    background:#4fc3ff;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}
/* スキップ文字 */

#skip-text{

    position: fixed;

    left: 20px;
    bottom: 20px;

    color: white;

    font-size: 24px;

    font-family: "Yomogi", cursive;

    opacity: 0.7;

    user-select: none;
}
#top-bar{
    position:fixed;
    top:-80px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    height:35px;
    background:#808080;
    border-radius:12px;
    transition:top .6s ease;
}

#top-bar.show{
    top:2cm;            /* 上から約2cm */
}
#scroll-icon{

    position:fixed;

    top:50%;
transform:translate(50px,-50%);

    right:10%;

    width:80px;
    height:80px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:60px;

    opacity:0;

    transform:translateX(50px);

    transition:all .8s ease;

}


#scroll-icon.show{

    opacity:1;

    transform:translate(0,-50%);

}
#player-ball{

    position:fixed;

    left:50%;

    width:80px;
    height:80px;

    object-fit:contain;

    transform:translateX(-50%);

    transition:left 0.8s ease;

}
#op-video{

    width:80%;
    height:auto;

}


#op-start-btn{

    display:none;

    position:absolute;

    bottom:100px;

    width:320px;
    height:90px;

    border:none;
    border-radius:18px;

    background:#666;

    color:white;

    font-size:40px;

    font-family:"Yomogi", cursive;

    cursor:pointer;

}


#op-start-btn:hover{

    background:#888;

}
</style>
</head>


<body>
    

    <!-- タイトル画面 -->
    <div id="title-screen">

        <h1>
            漢字 Typing<br>

            <span class="gradient-text">
                spin-off スピンオフ
            </span>

        </h1>

    </div>



    <!-- 会社名画面 -->
    <div id="company-screen">

        <div>

            <div class="company">
                会社:(秘密厳守のため名前は出しません)
            </div>

            <div class="member-grid">

                <div class="member">©月満社</div>
                <div class="member">Sさん</div>

                <div class="member">©The Original 0</div>
                <div class="member">Goriraさん</div>

                <div class="member">©The Original 0</div>
                <div class="member">Dさん</div>

            </div>

        </div>

    </div>



<!-- OP動画 -->
<div id="skip-screen">

    <video
    id="op-video"
    src="op.mp4"
    autoplay
    muted
    playsinline>
</video>

    <button id="op-start-btn">
        START
    </button>

</div>



    <!-- スタート画面 -->
    <div id="start-screen">

        <button id="start-btn">
            START
        </button>

    </div>



    <!-- 名前入力画面 -->
<div id="name-panel">

    <div class="panel">

        <h2>名前を入力してくれ！</h2>

        <input
            type="text"
            id="player-name"
            placeholder="ここに名前を入力"
            maxlength="12"
        >

        <button id="name-ok-btn">
            決定
        </button>

    </div>

</div>
<!-- 性別選択画面 -->
<div id="gender-panel">

    <div class="panel">

        <h2>男 or 女？</h2>

        <div class="gender-area">

<div class="gender-box" id="male-box">

    <div class="gender-icon">
        <img src="otoko.png" alt="" style="width: 76px; height: 76px;">
    </div>

    <div class="gender-arrow" id="male-arrow"></div>

</div>

            <div class="gender-box" id="female-box">

    <div class="gender-icon">
        <img src="onnna.png" alt="" style="width: 76px; height: 76px;">
    </div>

    <div class="gender-arrow" id="female-arrow"></div>

</div>

        </div>

        <button id="gender-ok-btn">
            決定
        </button>

    </div>

</div>
<!-- プレイヤー生成画面 -->
<div id="create-screen">

    <div id="gear">⚙️</div>
    <div id="top-bar"></div>
    <img id="player-ball" src="">
    <dov id="scroll-icon">📜</dov>
</div>
<div id="skip-text">スキップ（Zキー）</div> 
    <script>
        function showWMessage(){
    document.getElementById("skip-text").textContent =
    "↑ 上矢印キー(Wキー)を押すんだ!!";
}
        const title = document.getElementById("title-screen");
const company = document.getElementById("company-screen");
const skip = document.getElementById("skip-screen");

const startScreen = document.getElementById("start-screen");
const startBtn = document.getElementById("start-btn");

const nameScreen = document.getElementById("name-panel");
const nameOk = document.getElementById("name-ok-btn");
const playerName = document.getElementById("player-name");
const maleBox = document.getElementById("male-box");
const femaleBox = document.getElementById("female-box");

const maleArrow = document.getElementById("male-arrow");
const femaleArrow = document.getElementById("female-arrow");

const genderOkBtn = document.getElementById("gender-ok-btn");

let selectedGender = "";

// =========================
// タイトル画面
// =========================

// 0.3秒後 タイトル表示
setTimeout(() => {

    title.classList.add("show");

}, 300);

// 2秒後 タイトルを消す
setTimeout(() => {

    title.classList.remove("show");
    title.classList.add("hide");

}, 2000);

// =========================
// 会社名画面
// =========================

// 2.8秒後 会社名表示
setTimeout(() => {

    company.classList.add("show");

}, 2800);

// 4.8秒後 会社名を消す
setTimeout(() => {

    company.classList.remove("show");
    company.classList.add("hide");

}, 4800);

// =========================
// OP省略
// =========================

// 5.6秒後 OP省略表示
setTimeout(() => {

    skip.classList.add("show");

}, 5600);

// 7.0秒後 OP省略を消す
setTimeout(() => {

    skip.classList.remove("show");
    skip.classList.add("hide");

}, 7000);

// =========================
// START画面
// =========================

// 7.8秒後 START表示
setTimeout(() => {

    startScreen.classList.add("show");

}, 7800);

// STARTボタン
startBtn.addEventListener("click", () => {

    startScreen.style.display = "none";

    nameScreen.classList.add("show");

});

// =========================
// 名前決定
// =========================

nameOk.addEventListener("click", () => {

    const name = playerName.value.trim();

    if(name === ""){
        alert("君の名前がわからないぞ！");
        return;
    }

// 名前を保存
localStorage.setItem("playerName", name);

// 名前パネルを閉じる
nameScreen.classList.remove("show");

// 性別パネルを開く
document.getElementById("gender-panel").classList.add("show");

});

const savedName = localStorage.getItem("playerName");

if(savedName){
    playerName.value = savedName;
}
// =========================
// 性別選択
// =========================

maleBox.addEventListener("click", () => {

    console.log("男が押された");

    selectedGender = "男";

    maleArrow.textContent = "↑";
    femaleArrow.textContent = "";

});

femaleBox.addEventListener("click", () => {

    console.log("女が押された");

    selectedGender = "女";

    femaleArrow.textContent = "↑";
    maleArrow.textContent = "";

});

genderOkBtn.addEventListener("click", () => {
console.log("selectedGender =", selectedGender);

    if(selectedGender === ""){

        alert("性別を選んでくれ！");
        return;

    }

    localStorage.setItem("gender", selectedGender);

    // 性別パネルを閉じる
    document.getElementById("gender-panel").classList.remove("show");

    // プレイヤー生成画面
    document.getElementById("create-screen").classList.add("show");
    showWMessage();
    const savedGender = localStorage.getItem("gender");
const player = document.getElementById("player-ball");
if(savedGender === "男"){
    player.style.background = "#4fc3ff";
}

if(savedGender === "女"){
    player.style.background = "#ff6bb5";
}

    // 男なら水色
    if(selectedGender === "男"){

        document.getElementById("player-ball").style.background = "#4fc3ff";

    }

    // 女ならピンク
    if(selectedGender === "女"){

        document.getElementById("player-ball").style.background = "#ff6bb5";

    }

});

// =========================
// Zキーで全部スキップ
// =========================
document.addEventListener("keydown", (e) => {

    if (e.key.toLowerCase() !== "z") return;
    // 名前・性別が未設定ならスキップ禁止
if (
    !localStorage.getItem("playerName") ||
    !localStorage.getItem("gender")
) {
    alert("先に名前と性別を決めてくれ！");
    return;
}
// プレイヤー生成画面ではスキップ禁止
if (document.getElementById("create-screen").classList.contains("show")) {
    return;
}

    // 画面全体をふわっと消す
    document.body.style.transition = "opacity .6s ease";
    document.body.style.opacity = "0";

    setTimeout(() => {

        // 全画面を非表示
        title.style.display = "none";
        company.style.display = "none";
        skip.style.display = "none";
        startScreen.style.display = "none";
        nameScreen.classList.remove("show");
        document.getElementById("gender-panel").classList.remove("show");

        // プレイヤー生成画面
        document.getElementById("create-screen").classList.add("show");
        showWMessage();
        // ふわっと戻す
        document.body.style.opacity = "1";

    }, 600);

});
const gear = document.getElementById("gear");

let playerCanMove = false;
let gearSize = 13;
let barShown = false;
let scrollShown = false;

document.addEventListener("keydown", (e) => {

    if (
        e.key !== "w" &&
        e.key !== "W" &&
        e.key !== "ArrowUp"
    ) return;

    // バーが出たら、歯車を動かなくする😊
    if (barShown) return;

    gearSize += 1;
    gear.style.fontSize = gearSize + "px";

if (gearSize >= 39) {
    document.getElementById("skip-text").textContent =
    "→ 右矢印キー(Dキー)を押すんだ!!";

    const bar = document.getElementById("top-bar");

    bar.classList.add("show");

    // バーが降りてきてから位置を取得
    setTimeout(() => {

        const rect = bar.getBoundingClientRect();

        gear.style.left = (rect.left + 18) + "px";
        gear.style.top = (rect.top + rect.height / 2) + "px";

        gear.classList.add("move");

    }, 600); // バーの transition: top .6s と同じ時間
    setTimeout(() => {

    scrollIcon.classList.add("show");

}, 1800);

    gearSound.currentTime = 0;
    gearSound.play();
    barShown = true;
    playerCanMove = true;
    canMoveRight = true;
}
    

});
const gearSound = new Audio("gear.mp3");
gearSound.volume = 0.6;
const player = document.getElementById("player-ball");
const savedGender = localStorage.getItem("gender");
const scrollIcon = document.getElementById("scroll-icon");

let scrollRight = 10;
let scrollMoved = false;
console.log();
document.addEventListener("keydown", (e)=>{

    if(
        e.key !== "d" &&
        e.key !== "D" &&
        e.key !== "ArrowRight"
    ) return;

 if (!playerCanMove) return;
    if(!canMoveRight) return;


    const savedGender = localStorage.getItem("gender");

    if(savedGender === "男"){

    player.src = "otoko2.png";
    player.style.background = "transparent";

}

if(savedGender === "女"){

    player.src = "onnna2.png";
    player.style.background = "transparent";

}

});
// 主人公移動

const playerMove = document.getElementById("player-ball");

let playerX = 50;

document.addEventListener("keydown",(e)=>{

    if(
        e.key !== "d" &&
        e.key !== "D" &&
        e.key !== "ArrowRight"
    ) return;

    if(!playerCanMove) return;

    playerX += 0.3;

    if(playerX > 90){
        playerX = 90;
    }

    playerMove.style.left = playerX + "%";

    // 主人公とスクロールが触れたか確認
    const playerRect = playerMove.getBoundingClientRect();
    const scrollRect = scrollIcon.getBoundingClientRect();

    if(
        playerRect.right >= scrollRect.left &&
        playerRect.left <= scrollRect.right &&
        playerRect.bottom >= scrollRect.top &&
        playerRect.top <= scrollRect.bottom
    ){

        // もう接触判定をしない
        playerCanMove = false;

        // スクロールをバーへ移動
        const bar = document.getElementById("top-bar");
        const barRect = bar.getBoundingClientRect();

        scrollIcon.style.transition = "all 1.2s ease";

        scrollIcon.style.left =
            (barRect.left + 70) + "px";

        scrollIcon.style.top =
            (barRect.top + barRect.height / 2) + "px";

        scrollIcon.style.right = "";

        scrollIcon.style.transform =
            "translateY(-50%) scale(0.45)";

        scrollMoved = true;

    }

});
const opVideo = document.getElementById("op-video");
const opStartBtn = document.getElementById("op-start-btn");


// 動画終了したらSTART表示
opVideo.addEventListener("ended", ()=>{

    opStartBtn.style.display = "block";

});


// START押したらゲーム開始
opStartBtn.addEventListener("click", ()=>{

    skip.classList.remove("show");
    skip.classList.add("hide");

    setTimeout(()=>{

        startScreen.classList.add("show");

    },800);

});
</script>

</body>
</html>
